# Local development override: hot-reload + mounted sources.
# Usage: docker compose -f compose.yaml -f compose.override.yaml up --build
services:
  backend:
    command: node --watch src/index.js
    environment:
      NODE_ENV: development
    volumes:
      - ./src:/app/src:ro
      - ./prisma:/app/prisma:ro
      - ./prisma.config.js:/app/prisma.config.js:ro
      - backend_node_modules:/app/node_modules
    # generated/ client is produced by `prisma generate` at image build time;
    # keep the anonymous node_modules volume so the mount above doesn't hide it.

  frontend:
    command: npm run dev -- -p 3000
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    volumes:
      - ../stytchup/app:/app/app:ro
      - ../stytchup/components:/app/components:ro
      - ../stytchup/public:/app/public:ro
      - frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
